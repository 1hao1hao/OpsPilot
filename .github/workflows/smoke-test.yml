name: Smoke Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

  stage3-demos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OPSPILOT_DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5432/opspilot
      OPSPILOT_TEST_DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5432/opspilot
      OPSPILOT_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply runtime migration
        run: alembic upgrade head

      - name: Run Worker Crash Recovery demo
        id: reliability
        run: |
          output="$(python -m opspilot.evaluation.cli reliability --config benchmarks/configs/runtime_faults.yaml)"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "Reliability evidence: $output"

      - name: Run baseline Evaluation demo
        id: baseline
        run: |
          output="$(python -m opspilot.evaluation.cli run --config benchmarks/configs/deeprca_baseline.yaml --split dev)"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "Baseline evidence: $output"

      - name: Run hybrid Evaluation demo
        id: hybrid
        run: |
          output="$(python -m opspilot.evaluation.cli run --config benchmarks/configs/opspilot_hybrid.yaml --split dev)"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "Hybrid evidence: $output"

      - name: Validate Stage 3 demo evidence
        run: >-
          python scripts/validate_stage3_demos.py
          --reliability "${{ steps.reliability.outputs.path }}"
          --baseline "${{ steps.baseline.outputs.path }}"
          --hybrid "${{ steps.hybrid.outputs.path }}"

      - name: Upload Stage 3 demo evidence
        if: always() && steps.reliability.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: stage3-demo-evidence-${{ github.run_id }}
          path: |
            ${{ steps.reliability.outputs.path }}
            ${{ steps.baseline.outputs.path }}
            ${{ steps.hybrid.outputs.path }}

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run smoke tests
        run: |
          docker compose --profile smoke build
          docker compose --profile smoke up --wait --wait-timeout 120 api mock-env
          docker compose --profile smoke up --detach worker
          docker compose --profile smoke run --rm smoke-test

      - name: Collect logs
        if: always()
        run: |
          docker compose logs > smoke-test-logs.txt || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: smoke-test-logs.txt

      - name: Stop services
        if: always()
        run: docker compose --profile smoke down --volumes --remove-orphans
