name: Smoke Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -r requirements-dev.txt

      - name: Run unit, contract, evaluation, recovery, and regression tests
        run: python -m pytest -q --ignore=tests/smoke

  stage3-demos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OPSPILOT_DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5432/opspilot
      OPSPILOT_TEST_DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5432/opspilot
      OPSPILOT_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply runtime migration
        run: alembic upgrade head

      - name: Run Worker Crash Recovery demo
        id: reliability
        run: |
          output="$(python -m opspilot.evaluation.cli reliability --config benchmarks/configs/runtime_faults.yaml)"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "Reliability evidence: $output"

      - name: Run Fixed Planner Evaluation demo
        id: fixed
        run: |
          output="$(python -m opspilot.evaluation.cli run --config benchmarks/configs/fixed_planner.yaml --split dev)"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "Fixed Planner evidence: $output"

      - name: Run Adaptive Planner Evaluation demo
        id: adaptive
        run: |
          output="$(python -m opspilot.evaluation.cli run --config benchmarks/configs/adaptive_planner.yaml --split dev)"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "Adaptive Planner evidence: $output"

      - name: Run Adaptive without Dynamic L2 demo
        id: without_l2
        run: |
          output="$(python -m opspilot.evaluation.cli run --config benchmarks/configs/adaptive_without_dynamic_l2.yaml --split dev)"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "Without Dynamic L2 evidence: $output"

      - name: Run Full Adaptive RCA dev and frozen-test demos
        id: full
        run: |
          output="$(python -m opspilot.evaluation.cli run --config benchmarks/configs/full_adaptive_rca.yaml --split dev)"
          frozen="$(python -m opspilot.evaluation.cli run --config benchmarks/configs/full_adaptive_rca.yaml --split test)"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "frozen_path=$frozen" >> "$GITHUB_OUTPUT"
          echo "Full Adaptive evidence: $output"
          echo "Full Adaptive frozen evidence: $frozen"

      - name: Validate Stage 3 demo evidence
        run: >-
          python scripts/validate_stage3_demos.py
          --reliability "${{ steps.reliability.outputs.path }}"
          --fixed "${{ steps.fixed.outputs.path }}"
          --adaptive "${{ steps.adaptive.outputs.path }}"
          --without-l2 "${{ steps.without_l2.outputs.path }}"
          --full "${{ steps.full.outputs.path }}"
          --frozen "${{ steps.full.outputs.frozen_path }}"

      - name: Upload Stage 3 demo evidence
        if: always() && steps.reliability.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: stage3-demo-evidence-${{ github.run_id }}
          path: |
            ${{ steps.reliability.outputs.path }}
            ${{ steps.fixed.outputs.path }}
            ${{ steps.adaptive.outputs.path }}
            ${{ steps.without_l2.outputs.path }}
            ${{ steps.full.outputs.path }}
            ${{ steps.full.outputs.frozen_path }}

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run smoke tests
        run: |
          docker compose --profile smoke build
          docker compose --profile smoke up --wait --wait-timeout 120 api mock-env
          docker compose --profile smoke up --detach worker
          docker compose --profile smoke run --rm smoke-test

      - name: Run asynchronous Worker demo
        run: |
          docker compose --profile smoke stop worker
          request_id="ci-queued-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          accepted="$(curl --fail --silent --show-error http://localhost:8000/api/v1/runs \
            --header 'Content-Type: application/json' \
            --data '{"request_id":"'"$request_id"'","alert":{"alert_id":"ci-queued","service_name":"checkout-service","alert_type":"timeout","severity":"P1","timestamp":"2026-08-12T00:00:00Z","signals":{"db":{"replication_lag_seconds":20}}}}')"
          run_id="$(jq --exit-status --raw-output '.run_id' <<<"$accepted")"
          test "$(curl --fail --silent "http://localhost:8000/api/v1/runs/$run_id" | jq --raw-output '.status')" = "QUEUED"
          docker compose --profile smoke start worker
          for _ in $(seq 1 60); do
            status="$(curl --fail --silent "http://localhost:8000/api/v1/runs/$run_id" | jq --raw-output '.status')"
            if [ "$status" = "SUCCEEDED" ]; then
              curl --fail --silent "http://localhost:8000/api/v1/runs/$run_id/result" | jq --exit-status '.report'
              exit 0
            fi
            test "$status" != "FAILED"
            sleep 0.5
          done
          echo "Run $run_id did not recover from QUEUED in 30 seconds" >&2
          exit 1

      - name: Collect logs
        if: always()
        run: |
          docker compose logs > smoke-test-logs.txt || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: smoke-test-logs.txt

      - name: Stop services
        if: always()
        run: docker compose --profile smoke down --volumes --remove-orphans
