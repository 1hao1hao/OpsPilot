# DeepRCA-Agent Docker Compose
# PRD-06 §4 — 容器化编排，4 服务 + 5 Profile
#
# 服务矩阵:
#   redis       — 缓存与状态存储 (redis:7-alpine)
#   api / worker — HTTP 接入与可恢复执行
#   mock-env    — 模拟环境独立服务 (自建, :8001)
#   smoke-test  — 冒烟测试执行器 (run-to-completion)

networks:
  deeprca-net:
    driver: bridge

volumes:
  deeprca-redis-data:
  deeprca-logs:
  opspilot-postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
    ports:
      - "${OPSPILOT_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - opspilot-postgres-data:/var/lib/postgresql/data
    networks:
      - deeprca-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [runtime, full, smoke]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &opspilot-runtime-env
      OPSPILOT_DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@postgres:5432/opspilot
      OPSPILOT_REDIS_URL: redis://redis:6379/0
      OPSPILOT_MOCK_BASE_URL: http://mock-env:8001
      OPSPILOT_INVESTIGATION_MODE: ${OPSPILOT_INVESTIGATION_MODE:-v1}
      OPSPILOT_GRAPH_VERSION: ${OPSPILOT_GRAPH_VERSION:-opspilot-runtime-v6-compact-report}
      OPSPILOT_CHECKPOINT_SCHEMA_VERSION: ${OPSPILOT_CHECKPOINT_SCHEMA_VERSION:-3.0}
      OPSPILOT_SKILLS_ENABLED: ${OPSPILOT_SKILLS_ENABLED:-true}
      OPSPILOT_TOOL_TRANSPORT: ${OPSPILOT_TOOL_TRANSPORT:-native}
      OPSPILOT_INVESTIGATION_MAX_PARALLEL_TASKS: ${OPSPILOT_INVESTIGATION_MAX_PARALLEL_TASKS:-4}
      OPSPILOT_INVESTIGATION_MAX_SECONDS: ${OPSPILOT_INVESTIGATION_MAX_SECONDS:-120}
      OPSPILOT_INVESTIGATION_MAX_LLM_TOKENS: ${OPSPILOT_INVESTIGATION_MAX_LLM_TOKENS:-4000}
      OPSPILOT_LLM_ENABLED: ${OPSPILOT_LLM_ENABLED:-false}
      OPSPILOT_LLM_MODEL: ${OPSPILOT_LLM_MODEL:-deepseek-v4-flash}
      OPSPILOT_LLM_BASE_URL: ${OPSPILOT_LLM_BASE_URL:-https://api.deepseek.com}
      OPSPILOT_LLM_TIMEOUT_SECONDS: ${OPSPILOT_LLM_TIMEOUT_SECONDS:-30}
    networks: [deeprca-net]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [runtime, full, smoke]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "opspilot.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *opspilot-runtime-env
    ports:
      - "8000:8000"
    networks: [deeprca-net]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [runtime, full, smoke]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "opspilot.runtime.worker"]
    # The shared image healthcheck probes the API HTTP endpoint; the worker
    # intentionally exposes no HTTP server and is verified by the E2E smoke run.
    healthcheck:
      disable: true
    environment:
      <<: *opspilot-runtime-env
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    networks: [deeprca-net]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-env:
        condition: service_healthy
    profiles: [runtime, full, smoke]
  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: deeprca-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - deeprca-redis-data:/data
    networks:
      - deeprca-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles:
      - redis-only
      - full
      - smoke

  # ─── 模拟环境 ───────────────────────────────────────────
  mock-env:
    build:
      context: .
      dockerfile: mock_env.Dockerfile
    container_name: deeprca-mock-env
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AGENT_URL=http://api:8000
    volumes:
      - deeprca-logs:/app/logs
    networks:
      - deeprca-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/mock/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - mock
      - full
      - smoke

  # ─── 冒烟测试执行器 ─────────────────────────────────────
  smoke-test:
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: deeprca-smoke-test
    environment:
      - AGENT_URL=http://api:8000
      - MOCK_URL=http://mock-env:8001
      - PYTHONPATH=/app/src
    command: ["pytest", "-q", "tests/smoke/test_runtime_api.py", "tests/smoke/test_health.py"]
    networks:
      - deeprca-net
    depends_on:
      api:
        condition: service_healthy
      mock-env:
        condition: service_healthy
      worker:
        condition: service_started
    profiles:
      - smoke
