[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeprca-agent"
version = "0.3.0"
description = "LLM Agent 驱动的故障诊断智能体系统"
requires-python = ">=3.11"
authors = [{ name = "DeepRCA Team" }]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "langgraph>=0.1.0,<0.2.0",
    "langchain>=0.2.0,<0.3.0",
    "langchain-core>=0.2.0,<0.3.0",
    "langchain-openai>=0.1.0,<0.2.0",
    "packaging>=23.2,<24.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.25,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "aiokafka>=0.11.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "PyYAML>=6.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
]

[project.scripts]
opspilot-eval = "opspilot.evaluation.cli:main"
opspilot-worker = "opspilot.runtime.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
# DeepRCA is a frozen compatibility namespace during Stage 1. Its 175
# pre-existing lint findings are recorded in the Stage-1 evidence rather than
# mixed into the OpsPilot migration diff.
exclude = [
    "src/deeprca",
    "tests/unit",
    "tests/smoke",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
